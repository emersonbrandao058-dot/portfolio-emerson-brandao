<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Portfólio de Emerson Brandão — Web Designer e Desenvolvedor em Feira de Santana, Bahia." />
    <script>
      /* The saved language is applied before the first paint, so an English visit never flashes Portuguese metadata. */
      (() => { let lang = "pt"; try { if (localStorage.getItem("emerson-lang") === "en") lang = "en"; } catch {} const root = document.documentElement; root.dataset.lang = lang; if (lang === "en") { root.lang = "en"; } })();
    </script>
    <title>Emerson Brandão — Web Design &amp; Desenvolvimento</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
